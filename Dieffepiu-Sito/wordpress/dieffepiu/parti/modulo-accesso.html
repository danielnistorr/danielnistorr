<form class="modulo" id="modulo" method="post" action="{{azione}}">
  <h2>Richiesta di accesso</h2>
  <p class="guida-m">Per le aziende del settore. I campi con l’asterisco sono obbligatori.</p>
  <div class="campi">
      <div><label class="l" for="f-azienda">Azienda *</label><input id="f-azienda" name="azienda" type="text" autocomplete="organization" required></div>
      <div><label class="l" for="f-piva">Partita IVA *</label><input id="f-piva" name="piva" type="text" required></div>
      <div><label class="l" for="f-nome">Nome e cognome *</label><input id="f-nome" name="nome" type="text" autocomplete="name" required></div>
      <div><label class="l" for="f-email">Email *</label><input id="f-email" name="email" type="email" autocomplete="email" required></div>
      <div><label class="l" for="f-tel">Telefono</label><input id="f-tel" name="telefono" type="tel" autocomplete="tel"></div>
      <div><label class="l" for="f-attivita">Attività</label><select id="f-attivita" name="attivita"><option>Produttore di zanzariere</option><option>Assemblatore</option><option>Installatore</option><option>Rivenditore</option><option>Altro</option></select></div>
      <div class="pieno"><label class="l" for="f-messaggio">Note</label><textarea id="f-messaggio" name="messaggio" rows="6"></textarea></div>
  </div>
  <div class="miele" aria-hidden="true"><label for="f-sito">Lasciate vuoto questo campo</label><input id="f-sito" name="sito_web" type="text" tabindex="-1" autocomplete="off"></div>
  <label class="consenso"><input type="checkbox" name="consenso" value="1" required> <span>Ho letto l’<a href="https://www.iubenda.com/privacy-policy/11870350">informativa privacy</a> e acconsento al trattamento dei dati per la gestione della richiesta.</span></label>
  <div class="invia"><button class="bottone" type="submit">Chiedi l’accesso</button><p class="esito-m" role="status" aria-live="polite">{{esito}}</p></div>
  {{campi_wp}}
</form>
