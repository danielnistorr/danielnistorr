<form class="modulo" id="modulo" method="post" action="{{azione}}">
  <h2>Scriveteci</h2>
  <p class="guida-m">I campi con l’asterisco sono obbligatori.</p>
  <div class="campi">
      <div><label class="l" for="f-nome">Nome e cognome *</label><input id="f-nome" name="nome" type="text" autocomplete="name" required></div>
      <div><label class="l" for="f-azienda">Azienda *</label><input id="f-azienda" name="azienda" type="text" autocomplete="organization" required></div>
      <div><label class="l" for="f-email">Email *</label><input id="f-email" name="email" type="email" autocomplete="email" required></div>
      <div><label class="l" for="f-tel">Telefono</label><input id="f-tel" name="telefono" type="tel" autocomplete="tel"></div>
      <div><label class="l" for="f-paese">Paese</label><input id="f-paese" name="paese" type="text" autocomplete="country-name"></div>
      <div><label class="l" for="f-argomento">Argomento</label><select id="f-argomento" name="argomento"><option>Sistemi e componenti</option><option>Macchine</option><option>Ricambi</option><option>Listini e area riservata</option><option>Altro</option></select></div>
      <div class="pieno"><label class="l" for="f-messaggio">Messaggio *</label><textarea id="f-messaggio" name="messaggio" rows="6" required></textarea></div>
  </div>
  <div class="miele" aria-hidden="true"><label for="f-sito">Lasciate vuoto questo campo</label><input id="f-sito" name="sito_web" type="text" tabindex="-1" autocomplete="off"></div>
  <label class="consenso"><input type="checkbox" name="consenso" value="1" required> <span>Ho letto l’<a href="https://www.iubenda.com/privacy-policy/11870350">informativa privacy</a> e acconsento al trattamento dei dati per ricevere una risposta.</span></label>
  <div class="invia"><button class="bottone" type="submit">Invia la richiesta</button><p class="esito-m" role="status" aria-live="polite">{{esito}}</p></div>
  {{campi_wp}}
</form>
