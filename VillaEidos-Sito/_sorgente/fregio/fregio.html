<!doctype html>
<!-- Villa Eidos: il fregio d'apertura, la composizione che tiene il posto della foto della villa finche' la foto non c'e'.
     La rende fregio.mjs (Chromium, al doppio della misura) in due formati: largo (12:5, computer) e quasi quadrato (5:4, telefono).
     Solo parole del testo del cliente: villa, barchessa, giardino; Albignasego, alle porte di Padova. -->
<html lang="it">
<meta charset="utf-8">
<style>
@font-face{font-family:"Brygada 1918";src:url("../tema/assets/fonts/brygada-1918-latin.woff2") format("woff2");font-weight:400 700}
@font-face{font-family:"Pontano Sans";src:url("../tema/assets/fonts/pontano-sans-latin.woff2") format("woff2");font-weight:300 700}
html,body{margin:0;background:#E4DED2}
.fregio{position:relative;overflow:hidden;background:#E4DED2;color:#6E685D;display:flex;flex-direction:column;align-items:center;justify-content:center}
/* due filetti doppi, come l'architrave e la cornice di un fregio */
.fregio .filo{width:var(--filo);height:calc(var(--u) * .9);border-top:var(--t) solid #A39B8C;border-bottom:var(--t) solid #A39B8C}
.fregio .iscrizione{font-family:"Brygada 1918";font-weight:400;text-transform:uppercase;white-space:nowrap;letter-spacing:.2em;margin-right:-.2em;line-height:1;font-size:var(--corpo);
  margin-block:calc(var(--u) * 4.4) calc(var(--u) * 4)}
.fregio .iscrizione span{display:inline-block}
.fregio .sotto{font-family:"Pontano Sans";font-weight:500;text-transform:uppercase;letter-spacing:.32em;margin-right:-.32em;font-size:calc(var(--u) * 2.2);color:#7E776B;margin-top:calc(var(--u) * 3.4)}
/* computer: 1600 x 667 (12:5) */
.largo{width:1600px;height:667px;--u:10px;--corpo:58px;--filo:1310px;--t:1px}
.largo .punto{margin:0 .42em}
/* telefono: 540 x 432 (5:4), le tre parole una sotto l'altra */
.alto{width:540px;height:432px;--u:6px;--corpo:46px;--filo:392px;--t:1px}
.alto .iscrizione{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u) * 2.4);margin-block:calc(var(--u) * 4.6) calc(var(--u) * 4.2)}
.alto .iscrizione .punto{display:none}
.alto .sotto{letter-spacing:.28em;margin-right:-.28em}
</style>
<body>
<div class="fregio largo" id="largo">
  <div class="filo"></div>
  <div class="iscrizione"><span>Villa</span><span class="punto">·</span><span>Barchessa</span><span class="punto">·</span><span>Giardino</span></div>
  <div class="filo"></div>
  <div class="sotto">Albignasego, alle porte di Padova</div>
</div>
<div class="fregio alto" id="alto">
  <div class="filo"></div>
  <div class="iscrizione"><span>Villa</span><span class="punto">·</span><span>Barchessa</span><span class="punto">·</span><span>Giardino</span></div>
  <div class="filo"></div>
  <div class="sotto">Albignasego, Padova</div>
</div>
</body>
</html>
