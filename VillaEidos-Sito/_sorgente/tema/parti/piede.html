<!-- Piede di Villa Eidos (tema e anteprima, come testata.html). {{legale}} e' la riga con ragione sociale e
     partita IVA: finche' in config/contatti.php sono vuote, scrive che sono da completare (non si inventano). -->
<footer class="piede">
  <div class="piede-wrap">
    <div class="piede-alto">
      <a class="piede-logo" href="{{home}}#inizio" aria-label="Villa Eidos, inizio pagina"><img src="{{logo_intero}}" alt="Villa Eidos" width="200" height="217" loading="lazy"></a>
      <div class="piede-col">
        <p class="piede-nome">Villa EIDOS</p>
        <p>{{comune}}<br>{{indirizzi}}</p>
      </div>
      <div class="piede-col">
        <p><a href="tel:{{tel_link}}">Tel. {{tel}}</a><br><a href="mailto:{{email}}">{{email}}</a></p>
        <p><a href="{{mappa}}" target="_blank" rel="noopener">Apri la mappa</a></p>
      </div>
      <nav class="piede-col" aria-label="Sezioni">
        <a href="{{home}}#luogo">Il luogo</a><br>
        <a href="{{home}}#spazi">Gli spazi</a><br>
        <a href="{{home}}#arrivare">Come arrivare</a><br>
        <a href="{{home}}#disponibilita">Richiesta di disponibilità</a>
      </nav>
    </div>
    <div class="piede-basso">
      <span>© <span class="anno">{{anno}}</span> Villa Eidos · {{legale}}</span>
      <span><a href="{{privacy}}">Informativa privacy</a> · <a href="{{cookie}}">Cookie</a></span>
    </div>
  </div>
</footer>
