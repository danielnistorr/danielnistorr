<!-- Testata e menu del telefono di Villa Eidos. Lo stesso HTML serve al tema (functions.php, villaeidos_parte)
     e all'anteprima statica (build.py): {{...}} sono i segnaposti dei recapiti e degli indirizzi.
     Scorrendo la testata si compatta (classe "compatta", assets/sito.js). -->
<a class="salta" href="#contenuto">Vai al contenuto</a>
<header class="testa" id="testa">
  <div class="testa-wrap">
    <a class="testa-logo" href="{{home}}#inizio" aria-label="Villa Eidos, inizio pagina"><img src="{{logo}}" alt="Villa Eidos" width="300" height="98"></a>
    <nav class="testa-voci" aria-label="Sezioni">
      <a href="{{home}}#spazi">Spazi</a>
      <a href="{{home}}#complesso">Il complesso</a>
      <a href="{{home}}#arrivare">Come arrivare</a>
    </nav>
    <a class="testa-tel" href="tel:{{tel_link}}"><span class="testa-tel-parola">Chiama</span><span class="testa-tel-numero">{{tel}}</span></a>
    <a class="btn btn-verde testa-cta" href="{{home}}#disponibilita">Richiedi disponibilità</a>
    <button class="apri-menu" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
  </div>
</header>
<div class="menu" id="menu" role="dialog" aria-modal="true" aria-label="Menu">
  <div class="menu-riga">
    <img class="menu-logo" src="{{logo}}" alt="" width="300" height="98">
    <button class="chiudi-menu" type="button">Chiudi</button>
  </div>
  <nav aria-label="Sezioni">
    <a href="{{home}}#spazi">Spazi</a>
    <a href="{{home}}#complesso">Il complesso</a>
    <a href="{{home}}#attivita">Per chi</a>
    <a href="{{home}}#arrivare">Come arrivare</a>
    <a href="{{home}}#disponibilita">Richiesta di disponibilità</a>
  </nav>
  <p class="menu-fine"><a class="btn btn-verde" href="{{home}}#disponibilita">Richiedi disponibilità</a><br><a href="tel:{{tel_link}}">Tel. {{tel}}</a><br><a href="mailto:{{email}}">{{email}}</a></p>
</div>
